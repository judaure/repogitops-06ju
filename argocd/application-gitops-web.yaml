apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-web-dev
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/resources-finalizer
spec:
  project: default
  source:
    repoURL: https://github.com/judaure/repogitops-06ju.git
    targetRevision: HEAD
    path: gitops/overlay/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
